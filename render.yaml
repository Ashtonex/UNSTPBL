services:
  - type: web
    name: unstpbl-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @unstpbl/api build
    startCommand: pnpm --filter @unstpbl/api start
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - packages/api/**
        - packages/db/**
        - packages/shared/**
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: static
          name: unstpbl-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CHURCH_TIMEZONE
        value: Africa/Harare
      - key: CRON_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: BIBLE_API_KEY
        sync: false
      - key: SENTRY_DSN_API
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 0.1

  - type: static
    name: unstpbl-web
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @unstpbl/web build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - apps/web/**
        - packages/shared/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: unstpbl-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_TRACES_SAMPLE_RATE
        value: 0.1
      - key: VITE_SENTRY_REPLAY_SAMPLE_RATE
        value: 0.05
