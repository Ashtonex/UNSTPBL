services:
  - type: web
    name: unstpbl-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @unstpbl/api build
    startCommand: pnpm --filter @unstpbl/api start
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - packages/api/**
        - packages/db/**
        - packages/shared/**
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: static
          name: unstpbl-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CHURCH_TIMEZONE
        value: Africa/Harare
      - key: CRON_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: BIBLE_API_KEY
        sync: false
      - key: SENTRY_DSN_API
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 0.1
      # Text messages. All dashboard-managed (sync: false) so a blueprint sync can never reset
      # a live setting. Unset SMS_PROVIDER means safe test mode. See docs/SMS.md.
      - key: SMS_PROVIDER
        sync: false
      - key: SMS_MONTHLY_SEGMENT_CAP
        sync: false
      - key: SMS_COST_PER_SEGMENT_USD
        sync: false
      - key: CHURCH_NAME
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      # WhatsApp: same rules as SMS (dashboard-managed, safe test mode while unset). See docs/SMS.md.
      - key: WHATSAPP_PROVIDER
        sync: false
      - key: WHATSAPP_MONTHLY_MESSAGE_CAP
        sync: false
      - key: WHATSAPP_COST_PER_MESSAGE_USD
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WHATSAPP_MESSAGING_SERVICE_SID
        sync: false
      - key: WHATSAPP_TEMPLATE_VISITOR_WELCOME_SID
        sync: false
      - key: WHATSAPP_TEMPLATE_BIRTHDAY_SID
        sync: false
      - key: WHATSAPP_TEMPLATE_DAILY_VERSE_SID
        sync: false
      - key: WHATSAPP_TEMPLATE_ANNOUNCEMENT_SID
        sync: false

  - type: static
    name: unstpbl-web
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @unstpbl/web build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - apps/web/**
        - packages/shared/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: unstpbl-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_TRACES_SAMPLE_RATE
        value: 0.1
      - key: VITE_SENTRY_REPLAY_SAMPLE_RATE
        value: 0.05
