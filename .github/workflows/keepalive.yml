name: Keep API warm and run scheduled jobs

# Render's free tier puts the API to sleep after ~15 minutes without traffic, and
# the first request afterwards waits for a cold start. Pinging it every 10
# minutes keeps it awake. The same job triggers the scheduled push and birthday
# endpoints, which otherwise have nothing calling them.
#
# IMPORTANT: GitHub does not run "*/10" schedules on time. On a quiet repository it runs them
# every few hours (measured: roughly every 3 to 7 hours), so this is a best-effort backup,
# not a clock. Do not rely on any job below firing at a particular hour. For a reliable
# keep-warm ping and reliable daily jobs, point an external scheduler (for example
# cron-job.org, which is free) at the same URLs; see docs/OPERATIONS.md.
#
# One-time setup: Render dashboard -> unstpbl-api -> Environment -> copy CRON_SECRET,
# then GitHub -> Settings -> Secrets and variables -> Actions -> New secret named
# CRON_SECRET. Without it only the keep-warm ping runs.
# Optional repository variable API_URL overrides the default address below.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      API_URL: ${{ vars.API_URL || 'https://unstpbl-api.onrender.com' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Wake the API and keep it warm
        # A cold start can take a minute or more, so allow a long first attempt.
        run: curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 "$API_URL/health"

      - name: Dispatch due scheduled push notifications
        if: env.CRON_SECRET != ''
        run: |
          curl -fsS --max-time 60 -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "$API_URL/cron/push/dispatch-due"

      - name: Dispatch today's birthday announcements
        # Idempotent on the server (one post per person per year), so it is safe on every run.
        # It used to wait for the 04:00 UTC hour, but GitHub's schedule almost never fires then.
        if: env.CRON_SECRET != ''
        run: |
          curl -fsS --max-time 60 -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "$API_URL/cron/birthdays/dispatch-today"

      - name: Text today's verse to members who opted in (morning, 07:00 to 13:00 Harare)
        # Only reaches members who switched on "Today's verse" texts. Safe to repeat: the
        # server skips anyone already messaged today. While SMS is in test mode it only records
        # test entries in the message history; nothing is sent. Runs on the first run inside
        # the morning window, because GitHub's schedule cannot hit a single exact hour.
        if: env.CRON_SECRET != '' && github.event_name == 'schedule'
        run: |
          hour=$((10#$(date -u +%H)))
          if [ "$hour" -ge 5 ] && [ "$hour" -lt 11 ]; then
            curl -fsS --max-time 90 -X POST \
              -H "x-cron-secret: $CRON_SECRET" \
              "$API_URL/cron/sms/daily-verse"
          else
            echo "Not the daily verse window, skipping."
          fi
